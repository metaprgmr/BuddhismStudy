<html>
<head>
<meta charset="utf-8">
<title>《個人文集》目錄</title>
<link rel="stylesheet" href="../util/article.css">
<style>
th { border-bottom:2px solid gray; font-size:24px }
ol { font-size:20px; line-height:1.4 }
</style>
<script src="../util/utils.js"></script>
<script src="registry.js"></script>
</head>
<body><center>
<h1>《個人文集》目錄</h1>
<div id="content" class="contentW">
</div>
<span class="copyright"></span>
</center></body></html>

<script>
var buf = new Buffer(), idx = 1, testing = get('test');
buf.w('<center><table cellspacing="5px" cellpadding="0"><tr><th>佛法</th><th>修行</th><th>雜論</th><th>隨想</th></tr>');
buf.w('<tr><td valign="top" nowrap><ol>');
for (var i=0; i<lines.length; ++i) {
  var ln = lines[i];
  if (ln.startsWith('xxxx')) break;
  if (ln.startsWith('####')) {
    buf.w('</ol></td><td style="padding-left:0px" valign="top" nowrap>',
          `<ol start="${idx}">`);
    continue;
  }
  buf.w('<li>');
  var row = ln.split(MULTI_SEP);
  for (var j=0; j<row.length; ++j) {
    if (j>0) buf.w('，');
    ln = row[j].split('|');
    var id = ln[0], info = articleInfo[id];
    
    if (!info || info.invalidID) alert(`Dup id: ${id}`);
    else {
      var uri = testing ? `../a.html?id=${id}` : info.uri,
          ttl = info.title.replace('《','<small>《</small>').replace('》','<small>》</small>').replace('梗概','');
      if (ttl.startsWith('「一念相應一念佛」'))
        buf.w(`<a href="../a.html?id=all">「</a><a href="${uri}" title="${id}">${ttl.substr(1)}</a>`);
      else
        buf.w(`<a href="${uri}" title="${id}">${ttl}</a>`);
    }
  }
  buf.w('</li>');
  ++idx;
}
buf.w('</ol></td></tr></table><p>【<a href="../index.html">返回主頁</a>】</p></center><hr>'); 
buf.render('content');
</script>
